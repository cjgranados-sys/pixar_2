<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixar Animation Studios</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="Header">
        <h1 class="Header-h1">
            <a href="/" class="Header-a" title="Pixar Home">
                <img src="./assets/logo-pixar.png" alt="Pixar Animation Studios" class="Header-img">
            </a>
        </h1>

        <nav class="Navegacion">
            <ul class="Navegacion-ul">
                <li class="Navegacion-li">
                    <a href="#feature-films" class="Header-a-nav" title="Feature Films">Feature Films</a>
                </li>
                <li class="Navegacion-li">
                    <a href="#short-films" class="Header-a-nav" title="Short Films">Short Films</a>
                </li>
                <li class="Navegacion-li">
                    <a href="#technology" class="Header-a-nav" title="Technology">Technology</a>
                </li>
                <li class="Navegacion-li">
                    <a href="#careers" class="Header-a-nav" title="Careers">Careers</a>
                </li>
                <li class="Navegacion-li">
                    <a href="#extras" class="Header-a-nav" title="Extras">Extras</a>
                </li>
                <li class="Navegacion-li">
                    <a href="#about" class="Header-a-nav" title="About">About</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="Hero">
            <a href="#inside-out-2" class="Hero-a" title="Inside Out 2">
                <h2 class="hero-h2">
                    <img src="./assets/insideout-logo.png" alt="Disney Pixar Inside Out 2" class="hero-logo">
                </h2>
                <img src="./assets/insideout-fondo.jpg" alt="" role="presentation" class="hero-bg"> 
            </a>
        </section>

        <section class="Proyectos">
            <article class="Hoopers-article">
                <a href="#hoppers" class="Proyectos-a" title="Hoppers">
                    <figure class="Hoopers-figure">
                        <img src="./assets/Hoopers.png" class="Proyectos-img" alt="Disney Pixar Hoppers - In Theatres 2026">
                            <h3 class="Hoopers-h3">Hoppers</h3>
                    </figure>
                </a>
            </article>

            <article class="Toystory">
                <a href="#toy-story-5" class="Toystory-a" title="Toy Story 5">
                    <figure class="Toystory-figure">
                        <img src="./assets/Toystory.png" class="Toystory-img" alt="Disney Pixar Toy Story 5 - 2026">
                            <h3 class="Toystory-h3">Toy Story 5</h3>
                    </figure>
                </a>
            </article>

            <article class="Win-or-lose">
                <a href="#win-or-lose" class="Win-or-lose-a" title="Win or Lose">
                    <figure class="Win-or-lose-figure">
                        <img src="./assets/Winlose.png" class="Win-or-lose-img" alt="Personajes de la serie Win or Lose">
                            <h3 class="Win-or-lose-h3">Win or Lose</h3>
                    </figure>
                </a>
            </article>
        </section>
    </main>

    <footer class="Footer">
        <nav class="Footer-nav">
            <ul class="Footer-ul">
                <li class="Footer-li">
                    <a href="https://facebook.com/Pixar" class="Footer-a-nav" title="Facebook"><img src="./assets/facebook.svg" alt="Facebook"></a>
                </li>
                <li class="Footer-li">
                    <a href="https://twitter.com/Pixar" class="Footer-a-nav" title="Twitter"><img src="./assets/twitter.svg" alt="Twitter"></a>
                </li>
                <li class="Footer-li">
                    <a href="https://youtube.com/Pixar" class="Footer-a-nav" title="YouTube"><img src="./assets/youtube.svg" alt="YouTube"></a>
                </li>
                <li class="Footer-li">
                    <a href="https://instagram.com/Pixar" class="Footer-a-nav" title="Instagram"><img src="./assets/instagram.svg" alt="Instagram"></a>
                </li>
                <li class="Footer-li">
                    <a href="https://linkedin.com/company/pixar-animation-studios" class="Footer-a-nav" title="LinkedIn"><img src="./assets/linkedin.svg" alt="LinkedIn"></a>
                </li>
            </ul>
        </nav>

        <nav class="Enlaces-legales">
            <ul class="Legales-ul">
                <li><a href="#privacy-policy" title="Privacy Policy">Privacy Policy</a></li>
                <li><a href="#terms-of-use" title="Terms of Use">Terms of Use</a></li>
                <li><a href="#us-state-privacy" title="Your US State Privacy Rights">Your US State Privacy Rights</a></li>
                <li><a href="#childrens-privacy" title="Children's Online Privacy Policy">Children's Online Privacy Policy</a></li>
                <li><a href="#interest-based-ads" title="Interest-Based Ads">Interest-Based Ads</a></li>
            </ul>
        </nav>

        <p class="Footer-p"><small class="Footer-small">&copy; 1986 - 2024 Disney / Pixar</small></p>
        <button class="Footer-button" type="button">Do Not Sell or Share My Personal Information</button>
    </footer>
    
</body>
</html>
